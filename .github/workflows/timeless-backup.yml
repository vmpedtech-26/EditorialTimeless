name: Timeless - respaldo diario de Firestore

on:
  schedule:
    - cron: '17 6 * * *'   # todos los días 06:17 UTC (03:17 Argentina)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timeless_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Respaldar Firestore y usuarios
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup_firestore.js respaldo.json
      - name: Cifrar (contiene correos de usuarios)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -in respaldo.json -out respaldo.json.enc
          rm respaldo.json
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-timeless-${{ github.run_id }}
          path: timeless_app/respaldo.json.enc
          retention-days: 30
